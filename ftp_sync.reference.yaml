# =============================================================================
# FTP SYNC — Configuration Reference
#
# Documents every available setting in ftp_sync config files.
# Values shown are examples or defaults. This file is never loaded by the app.
# =============================================================================

# Config file names used by this app:
#   app.yaml
#   config.dev.yaml
#   config.test.yaml
#   config.prod.yaml
#   data_feeds/ftp.{name}.yaml


# =============================================================================
# FILE: app.yaml
# =============================================================================

name: ftp_sync
# Required. Must be ftp_sync.

enabled: true
# Options: true, false.

version: v01
# Informational version label.


# =============================================================================
# FILE: config.{env}.yaml
#
# Main app config. One per environment.
# =============================================================================

log_path: ~/logs/ftp_sync/ftp_sync.{operation}.{timestamp}.log
# Log file path.
# Tokens:
#   {operation}
#   {timestamp}

sync:
  chunk_size: 100
  # Optional default files-per-processing chunk.

schedule:
  description: "Daily at 06:00 AM"
  # Informational schedule text.


# =============================================================================
# FILE: data_feeds/ftp.{name}.yaml
#
# One or more FTP/SFTP connection entries. All files under data_feeds are
# merged into ctx.connections.
# =============================================================================

connections:

  - name: client01
    # Required unique connection name.

    ftp:
      protocol: ftp
      # Options:
      #   ftp
      #   ftps
      #   sftp

      host: ftp.client01.com
      # Required remote host.

      port: 21
      # Common values:
      #   21 for ftp/ftps
      #   22 for sftp

      user: env.ftp_user_client01
      password: env.ftp_password_client01
      # Use env.<name> references. Secrets should not be literal YAML values.

      max_retry_sessions: 3
      # Optional integer. Failed downloads are abandoned after this many runs.

    sync:
      chunk_size: 50
      # Files per processing chunk for this connection.

      max_files_per_run: null
      # null means no limit. Otherwise use an integer such as 500.

      remote_paths:
        - /incoming/
        - /archive/2026-*/
      # Remote directories or globbed remote directories.

      local_destination: ~/ftp_downloads/client01
      # Destination folder for downloaded files.

      state_file: ~/ftp_downloads/client01/.state.json
      # High-water mark/state tracking file.

      failed_file: ~/ftp_downloads/client01/.failed.json
      # Retry queue file.

      initial_stamp: null
      # null means start without a high-water mark.
      # Otherwise use a timestamp string accepted by the sync engine.

    filters:
      extensions: []
      # Include only these extensions. [] means all.
      # Examples: [.csv, .txt, .xlsx]

      exclude_extensions:
        - .filepart
        - .tmp
      # Always excluded extensions.

      name_pattern: null
      # Optional glob. null means no filename filter.
      # Example: "client01_*.csv"

      max_age_days: null
      # Optional integer. null means no age limit.


# =============================================================================
# FTP REMOTE FILE METADATA SHAPE
#
# The sync engine represents each remote file as a three-item tuple.
# All filter functions and download logic use this shape.
# =============================================================================

# Remote file tuple: (filename: str, modified_utc: datetime, size: int)
#   filename     — remote filename (basename only, not the full path)
#   modified_utc — last-modified timestamp in UTC
#   size         — file size in bytes; -1 when the server does not report it


# =============================================================================
# CLI — ftp_sync command-line interface
#
# All parameters are passed as --name value or --flag.
# =============================================================================

cli:
  invocation: "python main.py [shared_parameters] [--resync|--no-resync]"
  # Structured CLI contract for LLM/pipeline authors.
  # ftp_sync has no subcommands; app-specific flags are appended directly
  # after shared parameters.

  shared_parameters:
    - name: config-path
      required: false
      value_type: path
      description: Path to an app config file, installation config file, or config root.

    - name: config-dir
      required: false
      value_type: path
      description: Directory containing config.<env>.yaml.

    - name: environment
      required: false
      value_type: choice
      possible_values: [development, test, production]
      description: Runtime environment. Required when config-path is omitted.

    - name: installation
      required: false
      value_type: string
      description: Installation name.

    - name: set
      required: false
      repeatable: true
      value_type: KEY=VALUE
      description: Override an environment variable for this run.

    - name: pipeline-name
      required: false
      value_type: string
      description: Pipeline name supplied by pipeline_coordinator.

    - name: pipeline-run-id
      required: false
      value_type: string
      description: Unique pipeline run identifier supplied by pipeline_coordinator.

    - name: pipeline-step-name
      required: false
      value_type: string
      description: Pipeline step name supplied by pipeline_coordinator.

    - name: pipeline-step-id
      required: false
      value_type: string
      description: Optional unique pipeline step identifier.

    - name: log-file
      required: false
      value_type: path
      description: Shared pipeline JSONL log path.

  parameters:
    - name: resync
      required: false
      value_type: flag
      possible_values: [present]
      default: true
      mutually_exclusive_with: no-resync
      description: Check every remote file against state.

    - name: no-resync
      required: false
      value_type: flag
      possible_values: [present]
      mutually_exclusive_with: resync
      description: Use high-water marks to skip older remote files.

  examples:
    - "python main.py --environment development"
    - "python main.py --environment production --no-resync"
    - "python main.py --config-path ~/installations/ccc/configs/v01/config.prod.yaml"

# ftp_sync CLI parameters:
#
# --resync                  Check every remote file against the state file
#                           regardless of the high-water mark. Default behavior.
#
# --no-resync               Use the high-water mark stamp to skip remote files
#                           older than the last successful run. Faster for
#                           routine runs on large remote directories.
#
# --config-path <path>      Path to the installation config file or config root.
#                           Supersedes --config-dir and --environment.
#
# --config-dir <path>       Directory containing config.<env>.yaml.
#                           Overrides APP_CONFIG_DIR environment variable.
#
# --environment <value>     Runtime environment.
#                           Choices: development, test, production
#
# --installation <value>    Installation name.
#
# --set KEY=VALUE           Override a .env variable for this run. Repeatable.
#
# Pipeline coordinator arguments (injected by pipeline_coordinator):
#
# --pipeline-name <value>       Pipeline name.
# --pipeline-run-id <value>     Unique run identifier.
# --pipeline-step-name <value>  Step name within the pipeline.
# --pipeline-step-id <value>    Optional step identifier.
# --log-file <path>             Shared pipeline JSONL log file path.
#
# Usage examples:
#   python main.py --environment development
#   python main.py --environment production --no-resync
#   python main.py --config-path ~/installations/ccc/config/v01/config.prod.yaml
